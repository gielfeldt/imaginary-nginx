services:
  imaginary-test:
    image: h2non/imaginary:1.2.4
    container_name: imaginary-test
    command: -concurrency 10 -enable-url-source
    networks:
      - test-network
    environment:
      - PORT=9000
    # No health check - Imaginary container doesn't have curl

  cache-test:
    build:
      context: ../cache
      dockerfile: Dockerfile
    container_name: cache-test
    networks:
      - test-network
    volumes:
      - ./cache/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cache/imaginary.conf:/etc/nginx/imaginary.conf:ro
    environment:
      - IMAGINARY_URL=http://imaginary-test:9000
      - BYPASS_CACHE=0
    depends_on:
      - imaginary-test
    # Simple health check - try to reach Nginx
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -k -f https://localhost:443/thumbnail?width=10&url=https://httpbin.org/image/jpeg || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  test-runner:
    build:
      context: ./tests
      dockerfile: Dockerfile.test
    container_name: test-runner
    networks:
      - test-network
    environment:
      - BASE_URL=https://cache-test
      - HTTPS_PORT=443
      - HTTP_PORT=80
      - TEST_IMAGE_URL=https://httpbin.org/image/jpeg
      - TIMEOUT=15
      - TEST_ENV=docker
    depends_on:
      cache-test:
        condition: service_healthy
    volumes:
      - ./test-results:/tmp/test-results
    command: ["/tests/test.sh"]

networks:
  test-network:
    driver: bridge
    name: imaginary-test-network