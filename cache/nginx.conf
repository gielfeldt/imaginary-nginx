worker_processes  auto;

pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;

    access_log /dev/fd/1; # stdout
    error_log /dev/fd/2; # stderr

    # Hide server version
    server_tokens off;

    proxy_temp_path   /cache/static.temp 1 2;
    proxy_cache_path  /cache/static      levels=1:2    keys_zone=STATIC:10m inactive=365d  max_size=10g;

    root   /var/www;

    server {
        listen              443 ssl;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        include imaginary.conf;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen unix:/var/run/nginx.socket;

        resolver 127.0.0.1 valid=1s ipv6=off;
        resolver_timeout 5s;
        set $backend $IMAGINARY_URL;

        location / {
            access_log    off;
            log_not_found off;

            proxy_pass             $backend;
            proxy_set_header       Host $host;
            proxy_buffering        off;
            add_header Last-Modified '$upstream_http_date';
        }

    }

}
