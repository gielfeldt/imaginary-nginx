worker_processes  auto;
worker_rlimit_nofile 65535;

pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;

    access_log /dev/fd/1; # stdout
    error_log /dev/fd/2; # stderr

    # Hide server version
    server_tokens off;

    # Performance optimizations
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  10000;

    # Buffer and memory optimizations
    client_body_buffer_size     128k;
    client_max_body_size        100m;
    proxy_buffer_size           4k;
    proxy_buffers               8 4k;
    proxy_busy_buffers_size     8k;

    proxy_temp_path   /cache/static.temp 1 2;
    proxy_cache_path  /cache/static      levels=1:2    keys_zone=STATIC:20m inactive=365d  max_size=20g use_temp_path=off;

    root   /var/www;

    server {
        listen              443 ssl;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Cache bypass control via environment variable
        set $bypass_cache $BYPASS_CACHE;

        include imaginary.conf;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen unix:/var/run/nginx.socket;

        resolver 127.0.0.1 valid=1s ipv6=off;
        resolver_timeout 5s;
        set $backend $IMAGINARY_URL;

        location / {
            access_log    off;
            log_not_found off;

            proxy_pass             $backend;
            proxy_set_header       Host $host;
            proxy_buffering        off;
            add_header Last-Modified '$upstream_http_date';
        }

    }

}
