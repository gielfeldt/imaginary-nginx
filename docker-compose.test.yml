version: "3"

services:
  imaginary-test:
    image: h2non/imaginary:1.2.4
    command: -concurrency 10 -enable-url-source
    networks:
      - imaginary-test-network

  cache-test:
    build: ./cache
    volumes:
      - ./tests/cache/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tests/cache/imaginary.conf:/etc/nginx/imaginary.conf:ro
    environment:
      IMAGINARY_URL: http://imaginary-test:9000
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -k -f https://localhost:443/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - imaginary-test-network

  test:
    build: ./tests
    environment:
      TEST_ENV: docker
      BASE_URL: https://cache-test
      TEST_IMAGE_URL: https://images-assets.nasa.gov/image/KSC-20251113-PH-BLU01_0008/KSC-20251113-PH-BLU01_0008~medium.jpg
    volumes:
      - ./test-results:/tmp/test-results
    networks:
      - imaginary-test-network
    depends_on:
      imaginary-test:
        condition: service_started
      cache-test:
        condition: service_healthy

networks:
  imaginary-test-network:
    # driver: bridge
    name: imaginary-test-network
    internal: false
