name: Tests

on:
  push:
    branches: [ main, master, develop, ai-optimization ]
  pull_request:
    branches: [ main, master, develop, ai-optimization ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Make test script executable
      run: chmod +x tests/test.sh

    - name: Run tests
      run: |
        export TEST_IMAGE_URL="https://images-assets.nasa.gov/image/KSC-20251113-PH-BLU01_0008/KSC-20251113-PH-BLU01_0008~medium.jpg"
        export TIMEOUT="15"
        echo "Running test suite..."
        echo "TEST_IMAGE_URL: $TEST_IMAGE_URL"
        echo "TIMEOUT: $TIMEOUT"
        make test

    - name: Display test results
      if: always()
      run: |
        echo "=== Test Results ==="
        if [ -f test-results/test_results.json ]; then
          echo "JSON Results:"
          cat test-results/test_results.json
        fi
        if [ -f test-results/test_summary.txt ]; then
          echo ""
          echo "Summary:"
          cat test-results/test_summary.txt
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30

    - name: Cleanup
      if: always()
      run: docker system prune -f

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner on filesystem
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'

    - name: Upload filesystem scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-fs-results.sarif'

  docker-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t imaginary-nginx:test ./cache

    - name: Run Trivy on Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'imaginary-nginx:test'
        format: 'sarif'
        output: 'trivy-docker-results.sarif'

    - name: Upload Docker scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-docker-results.sarif'